<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple SCA consultation RAG self-assessment with live domain and overall scores.">
  <title>SCA consultation self-assessment</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23163049'/%3E%3Cpath d='M16 34l10 10 22-24' fill='none' stroke='%237cdbb2' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #173044; background: #f2f6f8; font-size: 16px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header { background: #163049; color: white; padding: 22px 0 25px; border-bottom: 5px solid #4db58e; }
    header .shell { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin: 0 0 5px; line-height: 1.2; letter-spacing: -.025em; }
    header p { margin: 0; color: #d5e4ec; line-height: 1.5; }
    main { padding: 24px 0 50px; }
    .scoreboard { background: #fff; border: 1px solid #d7e2e8; border-radius: 14px; padding: 18px 22px; box-shadow: 0 8px 28px #1c42500b; }
    .score-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; }
    .score-head h2 { margin: 0 0 4px; font-size: 1.14rem; }
    .score-head p { margin: 0; color: #516677; font-size: .9rem; line-height: 1.45; }
    .total { text-align: right; white-space: nowrap; }
    .total strong { display: block; color: #104567; font-size: 2.1rem; letter-spacing: -.05em; line-height: 1; }
    .total span { color: #516677; font-size: .85rem; }
    .domain-scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 18px; }
    .domain-score { background: #f2f6f8; border: 1px solid #e1e9ee; border-radius: 9px; padding: 11px 12px; }
    .domain-score span { display: block; font-size: .85rem; color: #506474; }
    .domain-score strong { font-size: 1.12rem; }
    .bar { height: 5px; border-radius: 9px; background: #dce8ed; overflow: hidden; margin-top: 8px; }
    .bar i { display: block; width: 0; height: 100%; background: #1b8197; transition: width .2s ease; }
    .scoring { color: #526879; font-size: .88rem; margin: 13px 0 0; line-height: 1.5; }
    .sections { display: grid; gap: 19px; margin-top: 22px; }
    .domain { background: #fff; border: 1px solid #d7e2e8; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px #1c425008; }
    .domain-heading { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; background: #e6eff3; padding: 16px 20px; border-bottom: 1px solid #d7e2e8; }
    .domain-heading h2 { font-size: 1.2rem; margin: 0; }
    .domain-heading span { color: #4e6271; font-size: .9rem; white-space: nowrap; }
    fieldset.item { border: 0; border-bottom: 1px solid #e7edf1; min-width: 0; margin: 0; padding: 13px 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
    fieldset.item:last-child { border-bottom: 0; }
    fieldset.item:focus-within { background: #f5fafb; }
    legend { float: left; width: 100%; padding: 0; font-weight: 500; line-height: 1.42; }
    .choices { display: flex; gap: 6px; }
    .choices label { cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 48px; min-height: 42px; border: 1px solid; border-radius: 8px; font-weight: 700; transition: background .12s ease, border-color .12s ease, color .12s ease; }
    .choices label.red { background: #fff2f1; color: #a84a45; border-color: #efc5c2; }
    .choices label.amber { background: #fff8e8; color: #8a650d; border-color: #efd99d; }
    .choices label.green { background: #edf9f2; color: #297452; border-color: #b9dfca; }
    .choices label.red:hover { background: #fde6e4; border-color: #d88e89; }
    .choices label.amber:hover { background: #fff0c9; border-color: #d6ad43; }
    .choices label.green:hover { background: #dff3e8; border-color: #75ba94; }
    .choices input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .choices label:has(input:focus-visible) { outline: 3px solid #17688b; outline-offset: 2px; }
    .choices label:has(input:checked) { border-width: 2px; }
    .choices label.red:has(input:checked) { background: #c84740; color: #fff; border-color: #9d2822; }
    .choices label.amber:has(input:checked) { background: #d69200; color: #241900; border-color: #a36f00; }
    .choices label.green:has(input:checked) { background: #248157; color: #fff; border-color: #145e3d; }
    @media (max-width: 650px) {
      header .shell { align-items: start; flex-direction: column; gap: 8px; }
      .shell { width: min(100% - 24px, 1180px); }
      main { padding-top: 14px; }
      .scoreboard { padding: 15px; }
      .domain-scores { grid-template-columns: 1fr; gap: 6px; margin-top: 13px; }
      .domain-score { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 8px 10px; }
      .domain-score .bar { grid-column: 1 / -1; margin-top: 5px; }
      .score-head p { max-width: 23ch; }
      .total strong { font-size: 1.65rem; }
      fieldset.item { padding: 13px 15px; }
      .domain-heading { padding: 14px 15px; }
    }
    @media (max-width: 410px) { fieldset.item { grid-template-columns: 1fr; gap: 9px; } .choices { justify-content: flex-start; } }
  </style>
</head>
<body>
  <header><div class="shell">
    <div><h1>SCA consultation self-assessment</h1><p>Rate each area as red, amber or green. Your scores update as you go.</p></div>
  </div></header>
  <main class="shell">
    <section class="scoreboard" aria-labelledby="score-title">
      <div class="score-head"><div><h2 id="score-title">Your score</h2><p id="progress">0 of 29 areas rated</p></div><div class="total"><strong id="total">0 / 58</strong><span>overall</span></div></div>
      <div class="domain-scores" id="domain-scores"></div>
      <p class="scoring">R = 0 · A = 1 · G = 2. Unrated areas count as 0 until selected. Refresh the page to start again.</p>
    </section>
    <div class="sections" id="sections"></div>
  </main>
  <script>
const domains = [
  { name: 'Global Skills', items: [
    'Structures consultation',
    'Avoids repetition',
    'Progresses through tasks',
    'Recognises ethical implications',
    'Finishes data gathering by 6–7 mins',
    'Uses clear language',
    'Remains responsive to the patient'
  ]},
  { name: 'Tasks', items: [
    'Opens consultation and explores problem',
    "Discovers patient's psycho-social context",
    'Identifies cues',
    'Discovers patient’s ICE',
    'Interprets appropriate examination and tests',
    'Generates / tests diagnostic hypotheses',
    'Rules in / out serious disease',
    'Reaches a working diagnosis / analysis',
    'Offers a safe patient centred management plan',
    'Manages co-morbidity appropriately',
    'Provides follow up/safety net'
  ]},
  { name: 'Relating to Others', items: [
    'Generates rapport',
    'Uses open questions appropriately',
    'Clarifies and explores cues offered',
    'Listens and shows curiosity',
    'Uses closed questions appropriately',
    'Explains rationale for questions',
    'Verbalises diagnosis and / or analysis',
    'Shares and uses ICE in plan',
    'Negotiates and uses psycho-social information in plan',
    'Shares risks / safety of options',
    'Supports in decision making'
  ]}
];

const count = domains.reduce((sum, domain) => sum + domain.items.length, 0);
const sections = document.getElementById('sections');
const summaries = document.getElementById('domain-scores');

function updateScores() {
  let overall = 0;
  let rated = 0;

  domains.forEach((domain, domainIndex) => {
    const selected = document.querySelectorAll(`input[data-domain="${domainIndex}"]:checked`);
    const score = Array.from(selected).reduce((sum, input) => sum + Number(input.dataset.score), 0);
    const maximum = domain.items.length * 2;
    overall += score;
    rated += selected.length;

    document.getElementById(`score-${domainIndex}`).textContent = `${score} / ${maximum}`;
    document.getElementById(`subtotal-${domainIndex}`).textContent = `${score} / ${maximum} · ${selected.length} of ${domain.items.length} rated`;
    document.getElementById(`bar-${domainIndex}`).style.width = `${(score / maximum) * 100}%`;
  });

  document.getElementById('total').textContent = `${overall} / ${count * 2}`;
  document.getElementById('progress').textContent = `${rated} of ${count} areas rated`;
}

domains.forEach((domain, domainIndex) => {
  const card = document.createElement('section');
  card.className = 'domain';
  card.setAttribute('aria-labelledby', `domain-${domainIndex}`);

  const heading = document.createElement('div');
  heading.className = 'domain-heading';
  const title = document.createElement('h2');
  title.id = `domain-${domainIndex}`;
  title.textContent = domain.name;
  const subtotal = document.createElement('span');
  subtotal.id = `subtotal-${domainIndex}`;
  subtotal.textContent = `0 / ${domain.items.length * 2} · 0 of ${domain.items.length} rated`;
  heading.append(title, subtotal);
  card.append(heading);

  domain.items.forEach((prompt, itemIndex) => {
    const fieldset = document.createElement('fieldset');
    fieldset.className = 'item';
    const legend = document.createElement('legend');
    legend.textContent = prompt;
    const choices = document.createElement('div');
    choices.className = 'choices';

    [['R', 0, 'red'], ['A', 1, 'amber'], ['G', 2, 'green']].forEach(([label, score, colour]) => {
      const choice = document.createElement('label');
      choice.className = colour;
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = `rating-${domainIndex}-${itemIndex}`;
      input.dataset.domain = String(domainIndex);
      input.dataset.score = String(score);
      input.setAttribute('aria-label', `${prompt}: ${label === 'R' ? 'red' : label === 'A' ? 'amber' : 'green'}`);
      input.addEventListener('change', updateScores);
      choice.append(input, document.createTextNode(label));
      choices.append(choice);
    });

    fieldset.append(legend, choices);
    card.append(fieldset);
  });

  sections.append(card);
  const box = document.createElement('div');
  box.className = 'domain-score';
  box.innerHTML = `<span>${domain.name}</span><strong id="score-${domainIndex}">0 / ${domain.items.length * 2}</strong><div class="bar" aria-hidden="true"><i id="bar-${domainIndex}"></i></div>`;
  summaries.append(box);
});

function resetAssessment() {
  document.querySelectorAll('input[type="radio"]').forEach((input) => { input.checked = false; });
  updateScores();
}

window.addEventListener('pageshow', resetAssessment);
resetAssessment();

</script>
</body>
</html>
